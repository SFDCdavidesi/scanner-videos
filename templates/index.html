<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Explorador de Vídeos y NAS</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    
    <!-- Bootstrap 5 & DataTables + Responsive Extension -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #f4f6f9; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .card-panel { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .folder-item { padding: 12px 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; }
        .folder-item:hover { background-color: #f8f9fa; }
        .breadcrumb-item a { text-decoration: none; cursor: pointer; }

        /* --- ESTILOS RESPONSIVE PARA IPHONE / MÓVIL --- */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .card-panel { padding: 15px; }
            h3 { font-size: 1.25rem; }
            #statusText { display: block; margin-top: 8px; font-size: 0.8rem; }
            .nav-tabs .nav-link { font-size: 0.82rem; padding: 0.45rem 0.6rem; }
            .mobile-stack-buttons { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 12px; }
            .mobile-stack-buttons .btn { width: 100%; }
            table.dataTable.dtr-inline.collapsed > tbody > tr > td.dtr-control:before {
                background-color: #0d6efd; /* Botón '+' color azul iOS */
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <!-- CABECERA ADAPTATIVA -->
        <div class="card-panel d-flex flex-column flex-md-row justify-content-between align-items-md-center">
            <div>
                <h3 class="m-0"><i class="bi bi-collection-play-fill text-primary"></i> Explorador Web NAS</h3>
                <small id="statusText" class="text-muted">Estado del escáner: Comprobando...</small>
            </div>
            <div class="d-flex gap-2 mobile-stack-buttons">
                <button class="btn btn-outline-secondary btn-sm" onclick="triggerScan(true)"><i class="bi bi-play-circle"></i> Retomar</button>
                <button class="btn btn-outline-primary btn-sm" onclick="triggerScan(false)"><i class="bi bi-arrow-clockwise"></i> Reiniciar Escaneo</button>
            </div>
        </div>

        <!-- PESTAÑAS RESPONSIVE -->
        <ul class="nav nav-tabs mb-3 flex-nowrap overflow-auto" id="mainTab" role="tablist" style="white-space: nowrap;">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#videos-pane">🎬 Vídeos</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#folders-pane" onclick="initFolderExplorer()">📁 Carpetas</button></li>
            <li class="nav-item"><button class="nav-link text-danger fw-bold" data-bs-toggle="tab" data-bs-target="#errors-pane" onclick="loadErrorsLog()"><i class="bi bi-exclamation-triangle-fill"></i> Errores (<span id="errorBadgeCount">0</span>)</button></li>
        </ul>

        <div class="tab-content">
            <!-- PESTAÑA VÍDEOS -->
            <div class="tab-pane fade show active card-panel" id="videos-pane">
                {% include 'partials/filters.html' %}
                {% include 'partials/table.html' %}
            </div>

            <!-- PESTAÑA CARPETAS -->
            <div class="tab-pane fade card-panel" id="folders-pane">
                {% include 'partials/folders.html' %}
            </div>

            <!-- PESTAÑA ERRORES -->
            <div class="tab-pane fade card-panel" id="errors-pane">
                {% include 'partials/errors.html' %}
            </div>
        </div>
    </div>

    <!-- REPRODUCTOR MODAL RESPONSIVE -->
    {% include 'partials/modals.html' %}

    <!-- LIBRERÍAS JQUERY, BOOTSTRAP, DATATABLES & RESPONSIVE PLUGIN -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>
    
    <script>
        let table;
        let rawFoldersData = [];
        let currentPath = "";

        $.fn.dataTable.ext.search.push(function(settings, data, dataIndex) {
            if (settings.nTable.id !== 'videosTable') return true;

            let locFilter = $('#filterLocation').val().toLowerCase();
            let dateTextQuery = $('#filterDateText').val().toLowerCase().trim();
            let startDate = $('#filterStartDate').val();
            let endDate = $('#filterEndDate').val();

            let rowCaptureDate = data[3] || "";
            let rowLocation = data[5] || "";

            if (locFilter && rowLocation.toLowerCase().indexOf(locFilter) === -1) {
                return false;
            }
            if (dateTextQuery && rowCaptureDate.toLowerCase().indexOf(dateTextQuery) === -1) {
                return false;
            }
            if (startDate || endDate) {
                if (!rowCaptureDate || rowCaptureDate === "No disponible") return false;
                let rowDateOnly = rowCaptureDate.substring(0, 10);
                if (startDate && rowDateOnly < startDate) return false;
                if (endDate && rowDateOnly > endDate) return false;
            }
            return true;
        });

        $(document).ready(function() {
            table = $('#videosTable').DataTable({
                ajax: { url: '/api/videos', dataSrc: '' },
                language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' },
                responsive: true,
                columns: [
                    { 
                        data: 'name', 
                        className: 'fw-bold all',
                        render: function(data, type, row) {
                            const safeName = (row.name || '').replace(/'/g, "\\'");
                            const encodedPath = encodeURIComponent(row.path || '');
                            // Nombre clickeable/táctil: en móvil muestra un icono de play delante
                            return `<a href="javascript:void(0);" onclick="playVideo('${encodedPath}', '${safeName}')" class="text-decoration-none text-primary d-inline-block py-1" style="cursor: pointer;" title="Tocar para reproducir">
                                        <i class="bi bi-play-circle-fill me-1 text-primary d-md-none"></i>${data}
                                    </a>`;
                        }
                    },
                    { data: 'duration', className: 'min-tablet' },      // Oculto en móvil (se ve con +)
                    { data: 'size_mb', className: 'desktop' },          // Visible solo en PC
                    { data: 'capture_date', className: 'all' },         // VISIBLE SIEMPRE (Móvil y PC)
                    { data: 'file_date', className: 'desktop' },        // VISIBLE EN PC (y con + en móvil)
                    { 
                        data: 'place_name',
                        className: 'all',                               // Visible siempre
                        render: function(data, type, row) {
                            if (!data) return '<span class="text-muted small">Desconocida</span>';
                            return `<span class="badge bg-info text-dark"><i class="bi bi-geo-alt-fill"></i> ${data}</span>`;
                        }
                    },
                    { data: 'path', className: 'none' },                // Oculto siempre en la tabla principal (sólo en +)
                    {
                        data: null,
                        className: 'all text-end',                      // Botones visibles siempre
                        render: function(data, type, row) {
                            return `
                                <div class="d-flex justify-content-end gap-1">
                                    <button class="btn btn-sm btn-primary" title="Reproducir" onclick="playVideo('${encodeURIComponent(row.path)}', '${row.name.replace(/'/g, "\\'")}')"><i class="bi bi-play-fill"></i></button>
                                    <button class="btn btn-sm btn-outline-secondary" title="Renombrar (Virtual en web)" onclick="renameVideo(${row.id}, '${row.name.replace(/'/g, "\\'")}')"><i class="bi bi-pencil"></i></button>
                                    <button class="btn btn-sm btn-outline-danger" title="Eliminar del listado web" onclick="deleteVideo(${row.id}, '${row.name.replace(/'/g, "\\'")}')"><i class="bi bi-trash"></i></button>
                                </div>
                            `;
                        }
                    }
                ]
            });

            $('#filterLocation, #filterDateText, #filterStartDate, #filterEndDate').on('keyup change', function() {
                table.draw();
            });

            setInterval(checkStatus, 3000);
            loadErrorsLogCount();
        });

        function resetFilters() {
            $('#filterLocation').val('');
            $('#filterDateText').val('');
            $('#filterStartDate').val('');
            $('#filterEndDate').val('');
            table.draw();
        }

        function renameVideo(id, currentName) {
            const newName = prompt("Introduce el nuevo nombre para este vídeo (sólo en la web):", currentName);
            if (newName && newName.trim() !== "" && newName !== currentName) {
                fetch('/api/videos/rename', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, new_name: newName.trim() })
                })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        table.ajax.reload(null, false);
                    } else {
                        alert("Error al renombrar el vídeo.");
                    }
                })
                .catch(err => alert("Error de red al renombrar."));
            }
        }

        function deleteVideo(id, name) {
            if (confirm(`¿Estás seguro de que deseas eliminar "${name}" del listado web?\n(Por seguridad, el archivo físico en el disco del NAS no se borrará).`)) {
                fetch('/api/videos/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        table.ajax.reload(null, false);
                    } else {
                        alert("Error al eliminar el vídeo del listado.");
                    }
                })
                .catch(err => alert("Error de red al eliminar."));
            }
        }

        function playVideo(encodedPath, name) {
            document.getElementById('videoModalTitle').innerText = name;
            const player = document.getElementById('webVideoPlayer');
            player.src = `/api/stream?path=${encodedPath}`;
            const modal = new bootstrap.Modal(document.getElementById('videoModal'));
            modal.show();
        }

        function stopVideo() {
            const player = document.getElementById('webVideoPlayer');
            player.pause();
            player.src = "";
        }

        function checkStatus() {
            fetch('/api/status').then(r => r.json()).then(data => {
                const count = data.total_count || 0;
                const statusEl = document.getElementById('statusText');
                if (statusEl) {
                    if (data.is_completed === false) {
                        const filesScanned = data.files_scanned || 0;
                        const startTime = data.start_timestamp || 0;
                        let speedText = "";
                        let elapsedText = "";

                        if (startTime > 0) {
                            const elapsedSeconds = Math.floor(Date.now() / 1000 - startTime);
                            if (elapsedSeconds > 0) {
                                const mins = Math.floor(elapsedSeconds / 60);
                                const secs = elapsedSeconds % 60;
                                elapsedText = ` | ⏱️ ${mins}m ${secs}s`;
                                const speed = (filesScanned / elapsedSeconds).toFixed(1);
                                speedText = ` (${speed} arch/s)`;
                            }
                        }

                        statusEl.innerHTML = `<span class="badge bg-warning text-dark">
                            <span class="spinner-border spinner-border-sm me-1"></span> 
                            Escaneando... | 🎬 Vídeos: <strong>${count}</strong> | 📁 Ficheros: <strong>${filesScanned}</strong>${speedText}${elapsedText} | 📍 ${data.last_folder || 'Iniciando...'}
                        </span>`;
                        table.ajax.reload(null, false);
                    } else {
                        statusEl.innerHTML = `<span class="badge bg-success">Completado | Vídeos totales: ${count} | Último escaneo: ${data.last_run || 'N/A'}</span>`;
                    }
                }
            });
            loadErrorsLogCount();
        }

        function loadErrorsLogCount() {
            fetch('/api/errors').then(r => r.json()).then(data => {
                document.getElementById('errorBadgeCount').innerText = data.length || 0;
            });
        }

        function loadErrorsLog() {
            fetch('/api/errors').then(r => r.json()).then(data => {
                const container = document.getElementById('errorsListContainer');
                document.getElementById('errorBadgeCount').innerText = data.length || 0;
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="p-4 text-center text-muted">No hay errores registrados.</div>';
                    return;
                }
                let html = '';
                data.forEach(err => {
                    html += `<div class="p-2 border-bottom text-danger font-monospace small"><strong>[${err.context}]</strong> ${err.timestamp}: ${err.message}</div>`;
                });
                container.innerHTML = html;
            });
        }

        function clearErrorsLog() {
            fetch('/api/errors/clear', { method: 'POST' }).then(() => loadErrorsLog());
        }

        function initFolderExplorer() {
            fetch('/api/folders').then(r => r.json()).then(data => {
                rawFoldersData = data;
                currentPath = "";
                renderFolderView("");
            });
        }

        function renderFolderView(targetPath) {
            currentPath = targetPath;
            const container = document.getElementById('foldersListContainer');
            
            let breadcrumbHtml = `<li class="breadcrumb-item"><a onclick="renderFolderView('')">Raíz</a></li>`;
            if (targetPath) {
                let parts = targetPath.split('/').filter(p => p);
                let accumulated = "";
                parts.forEach((part, index) => {
                    accumulated += "/" + part;
                    if (index === parts.length - 1) {
                        breadcrumbHtml += `<li class="breadcrumb-item active">${part}</li>`;
                    } else {
                        breadcrumbHtml += `<li class="breadcrumb-item"><a onclick="renderFolderView('${accumulated}')">${part}</a></li>`;
                    }
                });
            }
            document.getElementById('folderBreadcrumbs').innerHTML = breadcrumbHtml;

            let children = [];
            if (targetPath === "") {
                let rootsMap = {};
                rawFoldersData.forEach(f => {
                    let parts = f.path.split('/').filter(p => p);
                    if (parts.length >= 2) {
                        let rootPath = "/" + parts[0] + "/" + parts[1];
                        if (!rootsMap[rootPath]) {
                            rootsMap[rootPath] = { path: rootPath, total_files: 0, videos_found: 0, scanned_at: f.scanned_at };
                        }
                        rootsMap[rootPath].total_files += f.total_files;
                        rootsMap[rootPath].videos_found += f.videos_found;
                    }
                });
                children = Object.values(rootsMap);
            } else {
                let targetSlashCount = targetPath.split('/').filter(p => p).length;
                rawFoldersData.forEach(f => {
                    if (f.path.startsWith(targetPath + "/") && f.path !== targetPath) {
                        let subParts = f.path.split('/').filter(p => p);
                        if (subParts.length === targetSlashCount + 1) {
                            children.push(f);
                        }
                    }
                });
            }

            if (children.length === 0) {
                container.innerHTML = '<div class="p-4 text-center text-muted">No hay subcarpetas registradas en este nivel.</div>';
                return;
            }

            let html = '';
            children.sort((a, b) => a.path.localeCompare(b.path)).forEach(folder => {
                let folderName = folder.path.split('/').pop();
                html += `
                    <div class="folder-item" onclick="renderFolderView('${folder.path}')">
                        <div>
                            <i class="bi bi-folder-fill text-warning me-2 fs-5"></i>
                            <strong>${folderName}</strong><br>
                            <small class="text-muted ms-4" style="font-size:0.75rem;">${folder.path}</small>
                        </div>
                        <div class="text-end">
                            <span class="badge bg-secondary me-1">Ficheros: ${folder.total_files}</span>
                            <span class="badge bg-success">Vídeos: ${folder.videos_found}</span>
                            <i class="bi bi-chevron-right text-muted ms-2"></i>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
