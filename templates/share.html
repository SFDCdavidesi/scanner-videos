<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>

    <!-- Open Graph / WhatsApp / Telegram preview -->
    <meta property="og:type"        content="video.other">
    <meta property="og:title"       content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:url"         content="{{ share_url }}">
    <meta property="og:video"       content="{{ video_url }}">
    <meta property="og:video:type"  content="video/mp4">
    <meta property="og:video:width" content="1280">
    <meta property="og:video:height" content="720">
    {% if thumb_url %}
    <meta property="og:image"       content="{{ thumb_url }}">
    <meta property="og:image:width" content="400">
    {% endif %}

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="player">
    <meta name="twitter:title"       content="{{ title }}">
    <meta name="twitter:player"      content="{{ share_url }}">
    <meta name="twitter:player:stream" content="{{ video_url }}">
    <meta name="twitter:player:stream:content_type" content="video/mp4">
    {% if thumb_url %}
    <meta name="twitter:image"       content="{{ thumb_url }}">
    {% endif %}

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #111;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .container {
            width: 100%;
            max-width: 900px;
        }
        h1 {
            font-size: clamp(1rem, 3vw, 1.4rem);
            margin-bottom: 0.75rem;
            word-break: break-word;
            text-align: center;
        }
        .meta {
            font-size: 0.85rem;
            color: #aaa;
            text-align: center;
            margin-bottom: 1rem;
        }
        video {
            width: 100%;
            border-radius: 8px;
            background: #000;
            display: block;
            /* Required for iOS inline playback */
            -webkit-playsinline: true;
        }
        .footer {
            margin-top: 1rem;
            font-size: 0.75rem;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 {{ title }}</h1>
        <p class="meta">{{ description }}</p>
        <video
            controls
            playsinline
            preload="metadata"
            {% if thumb_url %}poster="{{ thumb_url }}"{% endif %}
        >
            <source src="{{ video_url }}" type="video/mp4">
            Tu navegador no soporta la reproducción de vídeo.
        </video>
        <p class="footer">Compartido desde el explorador de vídeos</p>
    </div>
</body>
</html>
