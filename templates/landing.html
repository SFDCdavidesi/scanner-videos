<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Explorador de Vídeos NAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #f4f6f9 0%, #d9e2ec 100%); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .landing-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; max-width: 500px; width: 100%; }
        .landing-icon { font-size: 3.5rem; color: #0d6efd; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="landing-card mx-auto">
            <div class="landing-icon">
                <i class="bi bi-collection-play-fill"></i>
            </div>
            <h2 class="fw-bold mb-3">Explorador de Vídeos NAS</h2>
            <p class="text-muted mb-4">
                Estás a punto de acceder al sistema privado de gestión, búsqueda y reproducción de archivos multimedia del servidor. Se requiere autenticación autorizada para continuar.
            </p>
            <a href="/login" class="btn btn-primary btn-lg w-100 py-3 fw-bold shadow-sm">
                <i class="bi bi-box-arrow-in-right me-2"></i> Acceder al Sistema de Vídeos
            </a>
        </div>
    </div>
</body>
</html>
