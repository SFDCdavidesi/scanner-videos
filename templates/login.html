<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Explorador de Vídeos NAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #f4f6f9 0%, #d9e2ec 100%); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .login-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); max-width: 400px; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card mx-auto">
            <div class="text-center mb-4">
                <span class="fs-1 text-primary"><i class="bi bi-lock-fill"></i></span>
                <h3 class="fw-bold mt-2">Iniciar Sesión</h3>
                <p class="text-muted small">Introduce tus credenciales para acceder al sistema</p>
            </div>
            
            <!-- Alertas dinámicas -->
            <div id="errorAlert" class="alert alert-danger d-none py-2 small text-center shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> Usuario o contraseña incorrectos.
            </div>
            <div id="lockedAlert" class="alert alert-warning d-none py-2 small text-center shadow-sm" role="alert">
                <i class="bi bi-shield-lock-fill me-1"></i> Demasiados intentos fallidos. Acceso bloqueado temporalmente (5 min).
            </div>

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label small fw-bold">Usuario</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label small fw-bold">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                </button>
            </form>
            <div class="text-center mt-3">
                <a href="/" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left"></i> Volver al inicio</a>
            </div>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === '1') {
            document.getElementById('errorAlert').classList.remove('d-none');
        } else if (urlParams.get('error') === 'locked') {
            document.getElementById('lockedAlert').classList.remove('d-none');
        }
    </script>
</body>
</html>
